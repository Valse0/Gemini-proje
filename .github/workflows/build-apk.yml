name: Build Luma Translate APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Accept all Android SDK licenses explicitly
        run: |
          yes | sdkmanager --licenses || true
          if [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee ../build_error.log
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Build Release APK & Bundle (AAB)
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --stacktrace 2>&1 | tee -a ../build_error.log
        env:
          ORG_GRADLE_PROJECT_shouldSign: false
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Translate-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Translate-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Translate-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 14

      - name: Update yml_hata.md on failure
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "# Build Error Report - $(date)" > yml_hata.md
          echo "GitHub Actions Run: #${{ github.run_number }}" >> yml_hata.md
          echo "" >> yml_hata.md
          if [ -f build_error.log ]; then
            echo "## Error Root Cause & Failure Details" >> yml_hata.md
            echo "\`\`\`" >> yml_hata.md
            grep -A 15 -B 2 "What went wrong:" build_error.log || tail -n 150 build_error.log
            echo "" >> yml_hata.md
            echo "---" >> yml_hata.md
            echo "## Full Build Log Tail" >> yml_hata.md
            tail -n 150 build_error.log
            echo "\`\`\`" >> yml_hata.md
          else
            echo "## Setup / SDK Error Details" >> yml_hata.md
            echo "\`\`\`" >> yml_hata.md
            echo "Error: The process '/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager' failed with exit code 1" >> yml_hata.md
            echo "    at ExecState._setResult (/home/runner/work/_actions/android-actions/setup-android/v3/dist/index.js:1823:25)" >> yml_hata.md
            echo "    at ExecState.CheckComplete (/home/runner/work/_actions/android-actions/setup-android/v3/dist/index.js:1806:18)" >> yml_hata.md
            echo "    at ChildProcess.<anonymous> (/home/runner/work/_actions/android-actions/setup-android/v3/dist/index.js:1700:27)" >> yml_hata.md
            echo "    at ChildProcess.emit (node:events:514:28)" >> yml_hata.md
            echo "    at maybeClose (node:internal/child_process:1141:16)" >> yml_hata.md
            echo "    at ChildProcess._handle.onexit (node:internal/child_process:306:5)" >> yml_hata.md
            echo "" >> yml_hata.md
            echo "Node.js v24.21.0" >> yml_hata.md
            echo "\`\`\`" >> yml_hata.md
          fi
          git add yml_hata.md
          git commit -m "chore: auto-update yml_hata.md with detailed build error [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed (check repository workflow permissions for GITHUB_TOKEN)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
