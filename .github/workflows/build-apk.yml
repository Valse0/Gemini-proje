name: Build Luma Translate APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship with an Android SDK already installed under
      # ANDROID_HOME/ANDROID_SDK_ROOT, with licenses pre-accepted by the image.
      # The previous "android-actions/setup-android@v3" step re-downloaded and
      # pointed at its own cmdline-tools build, and the job was failing inside
      # that action at "sdkmanager --licenses" before Gradle ever ran (see
      # yml_hata.md / run #21). Using the SDK already on the image removes that
      # extra moving part. We still (re-)accept licenses defensively and make
      # sure the exact platform/build-tools the Gradle config needs are
      # present, without treating an already-satisfied step as a failure.
      - name: Verify preinstalled Android SDK and required packages
        run: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            # Fall back to whatever cmdline-tools version the image shipped.
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager -type f 2>/dev/null | sort | tail -n1)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::No usable sdkmanager found under $SDK_ROOT/cmdline-tools. The runner image may have changed; a cmdline-tools install step is needed again."
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMANAGER"

          # Grant ownership of SDK_ROOT to runner user so sdkmanager can write licenses and packages
          sudo chown -R "$USER:$USER" "$SDK_ROOT" || true

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee ../build_error.log
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      # Release signing is optional and secret-driven. When a real signing
      # key is stored in repository secrets, decode it to a local file (never
      # committed, never logged) and point Gradle at it via project
      # properties, matching the conditional signingConfigs.release block in
      # android/app/build.gradle.kts. When the secret isn't configured, this
      # step is skipped and the release build proceeds unsigned, which is a
      # safer default than silently reusing the debug key for a release
      # artifact. The previous `ORG_GRADLE_PROJECT_shouldSign: false` env var
      # on the next step didn't correspond to anything Gradle actually read
      # (no `shouldSign` property existed anywhere in the build scripts), so
      # it has been removed rather than kept as dead configuration.
    
      - name: Decode release signing key (if configured)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build Release APK & Bundle (AAB)
        working-directory: android
        run: |
          if [ -f app/release.keystore ]; then
            ./gradlew assembleRelease bundleRelease --stacktrace \
              -PRELEASE_STORE_FILE=release.keystore \
              -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
              -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
              2>&1 | tee -a ../build_error.log
          else
            echo "No release signing secrets configured; building an unsigned release artifact."
            ./gradlew assembleRelease bundleRelease --stacktrace 2>&1 | tee -a ../build_error.log
          fi
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Translate-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Translate-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Translate-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 14

      # On failure, upload whatever log exists as a build artifact instead of
      # committing a report back into the repository. The previous version of
      # this step pushed a commit to main/master on every failed run, and its
      # fallback branch (used whenever the failure happened before
      # build_error.log existed, e.g. during SDK setup) wrote a hardcoded,
      # unchanging error message rather than the real cause of that specific
      # run. That made yml_hata.md look like a live diagnostic file while
      # actually being a static placeholder, and caused unbounded commit
      # churn on the default branch from an automated workflow.
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log-${{ github.run_number }}
          path: build_error.log
          if-no-files-found: warn
          retention-days: 14
