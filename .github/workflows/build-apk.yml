name: Build Luma Translate APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Build Release APK & Bundle (AAB)
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --stacktrace
        env:
          ORG_GRADLE_PROJECT_shouldSign: false
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Translate-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Translate-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Translate-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 14
