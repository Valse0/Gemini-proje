name: Build Luma Translate APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clean and Re-initialize Gradle Wrapper
        working-directory: android
        run: |
          rm -rf gradle/wrapper
          mkdir -p gradle/wrapper
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Release Bundle (AAB)
        working-directory: android
        run: ./gradlew bundleRelease
        env:
          ORG_GRADLE_PROJECT_shouldSign: false

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Translate-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Translate-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 14
